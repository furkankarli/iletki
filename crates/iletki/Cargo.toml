[package]
name = "iletki"
description = "Embeddable wgpu viewport for 2D and 3D CAD, GIS, and Rust editors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/iletki"
keywords = ["viewport", "wgpu", "cad", "gis", "picking"]
categories = ["graphics", "rendering"]

[features]
default = ["wgpu", "cad2d", "cad3d"]
wgpu = ["dep:iletki-wgpu"]
cad2d = ["wgpu", "dep:iletki-2d"]
cad3d = ["wgpu", "dep:iletki-3d"]
profiling = ["wgpu", "iletki-wgpu/profiling", "iletki-3d?/profiling"]

[[example]]
name = "webgpu_smoke"
required-features = ["cad2d"]

[[example]]
name = "assembly_bench"
required-features = ["cad3d", "profiling"]

[dependencies]
iletki-core.workspace = true
iletki-wgpu = { workspace = true, optional = true }
iletki-2d = { workspace = true, optional = true }
iletki-3d = { workspace = true, optional = true }

[lints]
workspace = true
