[package]
name = "iletki-demo"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
iletki = { path = "../../crates/iletki" }
# Avoid `wayland-csd-adwaita` so the demo does not pull in unmaintained `ttf-parser` (RUSTSEC-2026-0192).
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[lints]
workspace = true
