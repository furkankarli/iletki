name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Native CI (${{ matrix.os }}, ${{ matrix.backend }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: vulkan
          - os: windows-2025
            backend: dx12
          - os: macos-26
            backend: metal
    runs-on: ${{ matrix.os }}
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      ILETKI_EXPECT_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Select a deterministic Vulkan adapter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libfontconfig-dev \
            libxkbcommon-x11-0 xauth xvfb
          lavapipe_icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$lavapipe_icd"
          echo "VK_DRIVER_FILES=$lavapipe_icd" >> "$GITHUB_ENV"

      - name: Verify rendered pixels and 64-bit picking
        run: >-
          cargo test --locked --workspace --all-features --test headless
          on_demand_caches_static_scene_and_picks_64bit_id -- --exact --nocapture

      - run: cargo xtask ci

      - name: Verify the release archives with the standalone egui example
        if: runner.os == 'Linux'
        run: python3 .github/scripts/package-smoke.py

      - name: Verify the standalone Slint example
        if: runner.os == 'Linux'
        env:
          SLINT_BACKEND: winit
          SLINT_WGPU_CPU: '1'
          SLINT_SCALE_FACTOR: '2'
        run: |
          cargo fmt --manifest-path examples/slint/Cargo.toml --check
          cargo deny --manifest-path examples/slint/Cargo.toml --config examples/slint/deny.toml --locked check
          cargo clippy --locked --manifest-path examples/slint/Cargo.toml --target-dir target/slint-demo -- -D warnings
          xvfb-run -a cargo run --locked --manifest-path examples/slint/Cargo.toml --target-dir target/slint-demo -- --smoke

  webgpu:
    name: Browser WebGPU (headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Read the locked wasm-bindgen version
        id: bindgen
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("Cargo.lock", "rb") as lock:
              packages = tomllib.load(lock)["package"]
          versions = {pkg["version"] for pkg in packages if pkg["name"] == "wasm-bindgen"}
          version, = versions
          print(f"version={version}")
          PY

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build the WebGPU smoke example
        run: |
          cargo build --locked -p iletki --example webgpu_smoke --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-name smoke --out-dir target/webgpu-smoke \
            target/wasm32-unknown-unknown/debug/examples/webgpu_smoke.wasm

      - name: Verify render, 4× section and outline coverage, and asynchronous 64-bit picking
        run: |
          google-chrome --version
          node .github/scripts/webgpu-smoke.mjs

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, webgpu]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish release notes for the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("The release tag must match the workspace version.")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          notes = changelog.partition(f"\n## {version}\n")[2].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit(f"No changelog entry for {version}.")
          (Path(os.environ["RUNNER_TEMP"]) / "release-notes.md").write_text(notes, encoding="utf-8")
          PY
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
